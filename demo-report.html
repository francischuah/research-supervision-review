<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Demonstration Supervision Report</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body.demo-document{background:#dbe3ea;padding:25px 10px}
    .demo-toolbar{max-width:210mm;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center;font:600 13px Arial;color:#153c5e}
    .demo-toolbar button{background:#15395d;color:white}
    @media print{body.demo-document{padding:0!important}.demo-toolbar{display:none!important}body.demo-document>.report-paper{display:block!important}}
  </style>
</head>
<body class="demo-document">
  <div class="demo-toolbar"><span>Fictional example · DBA case study proposal</span><button onclick="window.print()">Print / Save as PDF</button></div>
  <div id="demoReport"></div>
  <script src="data.js"></script>
  <script src="report.js"></script>
  <script>
    const template = starterTemplates()[0];
    document.getElementById('demoReport').innerHTML = renderReport(demoReview(template));
    const paper = document.querySelector('#demoReport .report-paper');
    if (paper) document.body.appendChild(paper);
    document.getElementById('demoReport').remove();
  </script>
</body>
</html>
