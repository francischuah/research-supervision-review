<!doctype html>
<html lang="en"><head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Supervision Review System</title><link rel="stylesheet" href="style-v1.2.1.css"></head>
<body><header class="topbar"><div class="brand"><strong>Research Supervision</strong><span>Review System · Version 1.2</span></div><div class="top-actions"><button id="newBtn">New</button><button id="saveBtn">Save</button><button id="previewBtn" class="primary">Preview report</button><button id="printBtn">Print / PDF</button><button id="exportBtn">Export JSON</button><label class="button" for="importFile">Import JSON</label><input id="importFile" type="file" accept="application/json,.json" hidden></div></header>

<div id="toast" role="status" aria-live="polite"></div><script src="data-v1.2.1.js"></script><script src="report-v1.2.1.js"></script><script src="app-v1.2.1.js"></script></body></html>
